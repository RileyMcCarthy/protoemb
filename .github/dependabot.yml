version: 2
updates:
  # Host runtime crate (also the wasm client + bridge binary).
  - package-ecosystem: cargo
    directory: /runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Wire framing crate (zero runtime deps; covers dev-deps if any appear).
  - package-ecosystem: cargo
    directory: /framing
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Code generator (pyyaml + jinja2).
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions used by CI.
  # Do not Dependabot-bump version tags of dtolnay/rust-toolchain: the MSRV
  # job pins a real Rust version (e.g. @1.78.0), not an action release line.
  # Other jobs use @stable. See closed PR #11 (invalid bump to 1.100.0).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
